# Sources:
# https://www.debian.org/releases/bookworm/example-preseed.txt
# https://gist.githubusercontent.com/zyra83/fd9409d618944ecb71269a86830805b6/raw/8049c3aa3bbd8a7951e579d44892150b77171ad1/amd64-main-full.txt
# https://github.com/yannbreizh/debian-installer/blob/master/preseed-192.168.10.35.cfg
# https://github.com/Tontonjo/debian/blob/master/preseed/jo/preseed.cfg

# --- LOCALE ---

d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/supported-locales multiselect en_US.UTF-8, fr_FR.UTF-8

# d-i keyboard-configuration/xkb-keymap select us
# not a typo: fr(azery)
d-i keyboard-configuration/xkb-keymap select fr(azery)

# --- USER ---
# To NOT Create a normal user:
#d-i passwd/make-user boolean false

# To create a normal user account.
d-i passwd/user-fullname string homelab
d-i passwd/username string homelab

# Normal user's password, either in clear text
d-i passwd/user-password password homelab!
d-i passwd/user-password-again password homelab!

#  --- ROOT ---

# ROOT account settings
# Root password, either in clear text
d-i passwd/root-password password root!
d-i passwd/root-password-again password root!

# --- NETWORK ---

# netcfg will choose an interface that has link if possible. This makes it
# skip displaying a list if there is more than one interface.

d-i netcfg/choose_interface select auto
# d-i netcfg/choose_interface select eth0

# Configure the network manually
# d-i netcfg/disable_autoconfig boolean true
# d-i netcfg/disable_dhcp boolean true
# d-i netcfg/dhcp_failed note
# d-i netcfg/dhcp_options select Configure network manually
# d-i netcfg/get_ipaddress string 192.168.1.250
# d-i netcfg/get_netmask string 255.255.255.0
# d-i netcfg/get_gateway string 192.168.1.254
# d-i netcfg/get_nameservers string 192.168.1.254
# d-i netcfg/confirm_static boolean true

# hostnames / domain
d-i netcfg/hostname string homelab
d-i netcfg/domain string local
d-i netcfg/get_hostname string homelab
d-i netcfg/get_domain string local
d-i netcfg/confirm_static boolean true

# Disable that annoying WEP key dialog.
d-i netcfg/wireless_wep string
d-i hw-detect/load_firmware boolean false

# --- MIRROR ---
 
# Mirror settings
d-i apt-setup/use_mirror boolean true
d-i mirror/country string manual
# can also use: ftp.fr.debian.org or other location specific but deb.debian.org should be more stable
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string bookworm

# --- CLOCK ---
# Clock and time zone setup
# Controls whether or not the hardware clock is set to UTC.
d-i clock-setup/utc boolean true

# You may set this to any valid setting for $TZ; see the contents of
# /usr/share/zoneinfo/ for valid values.
d-i time/zone string Europe/Paris

# --- PARTITION ---

# Force UEFI install
d-i partman-efi/non_efi_system boolean true

# If one of the disks that are going to be automatically partitioned
# contains an old LVM configuration, the user will normally receive a
# warning. This can be preseeded away...
d-i partman-lvm/device_remove_lvm boolean true
# The same applies to pre-existing software RAID array:
d-i partman-md/device_remove_md boolean true
# And the same goes for the confirmation to write the lvm partitions.
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# make lvm the max size
d-i partman-auto-lvm/guided_size string max
d-i partman-auto-lvm/new_vg_name string debian

# use the following partition scheme on /dev/sda
# d-i partman-auto/disk string /dev/sda
d-i partman-auto/disk string /dev/nvme0n1
# In addition, you'll need to specify the method to use.
# The presently available methods are:
# - regular: use the usual partition types for your architecture
# - lvm:     use LVM to partition the disk
# - crypto:  use LVM within an encrypted partition
d-i partman-auto/method string regular
# You can choose one of the three predefined partitioning recipes:
# - atomic: all files in one partition
# - home:   separate /home partition
# - multi:  separate /home, /usr, /var, and /tmp partitions
d-i partman-auto/choose_recipe select atomic

# This makes partman automatically partition without confirmation, provided
# that you told it what to do using one of the methods above.
d-i partman-basicfilesystems/no_mount_point boolean false
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- INSTALL ---

# Install standard system
tasksel tasksel/first multiselect standard, ssh-server

# Also install additional package
d-i pkgsel/include string openssh-server sudo net-tools curl wget vim dnsutils
openssh-server openssh-server/permit-root-login boolean true

# Upgrade packages after debootstrap.
# Allowed values: none, safe-upgrade, full-upgrade
d-i pkgsel/upgrade select full-upgrade

# --- OTHER ---

# Avoid "Scan another CD or DVD?" message
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false   
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# Participation to popularity contest
popularity-contest popularity-contest/participate boolean false

# --- GRUB ---

# Grub
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
# d-i grub-installer/bootdev string /dev/sda
d-i grub-installer/bootdev string /dev/nvme0n1

# --- END ---

# late command:
# setup ssh
# add homelab user to sudoers
# copy scripts to root bin folder
# create ansible user with appropriate key, add to suoders
#
# workflow:
# configure ssh
# homelab setup
# homelab custom scripts
# ansible ssh setup
d-i	preseed/late_command string \
    in-target sed -i '/PermitRootLogin/c PermitRootLogin yes' /etc/ssh/sshd_config ; \
    in-target sed -i '/#PermitEmptyPasswords/c PermitEmptyPasswords yes' /etc/ssh/sshd_config ; \
    in-target sed -i 's/nullok_secure/nullok/' /etc/pam.d/common-auth ; \
    in-target usermod -aG sudo homelab ; \
    in-target mkdir -p /root/bin ; \
    cp /cdrom/custom/scripts/reset_server.sh /target/root/bin/reset_server.sh ; \
    in-target chmod 700 /root/bin/reset_server.sh ; \
    in-target useradd -m -d /home/ansible -G sudo -s /bin/bash ansible ; \
    in-target passwd ansible -d ; \
    in-target mkdir /home/ansible/.ssh ; \
    in-target chmod 700 /home/ansible/.ssh ; \
    cp /cdrom/custom/ssh/ansible_key.pub /target/home/ansible/.ssh/authorized_keys ; \
    cp /cdrom/custom/ssh/ansible.sudoers /target/etc/sudoers.d/ansible ; \
    in-target chmod 0440 /etc/sudoers.d/ansible

# don't wait for confirm, just reboot when finished
d-i finish-install/reboot_in_progress note