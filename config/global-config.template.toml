[global]
	# Domain used for local/lan name resolution. See apps/reverse-proxy.
	INTERNAL_DOMAIN="l.ab"
	# Domain used for external name resolution (internet). See apps/reverse-proxy.
	EXTERNAL_DOMAIN="example.com"

[infra]
	## Users
	# Passwords will automatically be hashed with sha512
	# Root user
	ROOT_PASSWORD="long_root_password1!"
	# Admin user (homelab)
	USER_HOMELAB_PASSWORD="long_password1!"

	## Networking
	# IP of local PC that runs IAC
	IP_CONTROL_NODE="192.168.1.165"
	# Server IPs
	IP_SERVER="192.168.1.200"
	IP_GATEWAY="192.168.1.254"
	IP_NAMESERVER="192.168.1.254"

[users]
	# Is overriden by the users-config.toml file if defined
	
	# Mandatory "admin" user password used accross apps and SSO Provider
	ADMIN_PASSWORD="not_implemented()"
	
[iac] # iac
	## Proxmox setup
	# Admin user in proxmox UI (for Proxmox VE Auth server)
	PROXMOX_ADMIN_PASSWORD="not_implemented()" # Must be longer than 8 char

	## VM keyboard layout 
	# - french/azerty: "fr fr" (default)
	# - us/qwerty: "us us"
	KEYBOARD_LAYOUT="fr fr"

[preseed] # preseed
	# /dev/sda for SSD ; /dev/nvme0n1 for NVME
	DISK="/dev/sda"
	
	# Proxmox host keyboard layout
	# - french/azerty: "fr(azery)" (default) (not a typo)
	# - us/qwerty: "us"
	KEYBOARD_LAYOUT="fr(azery)"
	
[cloud] # apps/cloud
	enabled=false

	NEXTCLOUD_ADMIN_USER=""
	NEXTCLOUD_ADMIN_PASSWORD=""
	MYSQL_USER=""
	MYSQL_PASSWORD=""

[dns] # apps/dns
	enabled=true

[firewall-gw] # apps/firewall-gw
	enabled=true

[firewall-mgmt] # apps/firewall-mgmt
	enabled=true

[firewall-srv] # apps/firewall-srv
	enabled=true

[home-automation] # apps/home-automation
	enabled=false

[immich] # apps/immich
	enabled=false

	DB_PASSWORD=""

[jump] # apps/jump
	enabled=true

[management] # apps/management
	enabled=true

[media-management] # apps/media-management
	enabled=true

	## Gluetun (vpn)
	# VPN provider credentials. Example: nordvpn, protonvpn
	# https://github.com/qdm12/gluetun-wiki/tree/main/setup/providers
	VPN_SERVICE_PROVIDER="protonvpn"
	VPN_USERNAME=""
	VPN_PASSWORD=""

	## Bazarr
	# Optional: For automatic subtitles with Bazarr
	# Create an account here: https://www.opensubtitles.com/
	OPENSUBTITLE_USERNAME=""
	OPENSUBTITLE_PASSWORD=""

	## Prowlarr
	# Private providers
	# Optional: Sharewood indexer passkey
	SHAREWOOD_PASSKEY=""

[media-server] # apps/media-server
	enabled=true

	MEDIA_SERVER_NAME="media-server"
	
	## Plex
	# Token for the Plex server. It is generated the first time, when the server is claimed.
	# PLEX_CLAIM=""
	# Id of the machine for your Plex server. It is generated the first time, when the server is claimed.
	# PLEX_MACHINE_IDENTIFIER=""
	# Username and Email for the account linked with the Plex server.
	# PLEX_USERNAME=""
	# PLEX_EMAIL=""
	
	## Jellyfin

[nas] # apps/nas
	enabled=true

[notes] # apps/notes
	enabled=false

[reverse-proxy] # apps/reverse-proxy
	enabled=true

	## Swag
	# Which DNS provider you are using
	# Depending on the DNS provider, you need to add support for the correct .ini file in apps/reverse-proxy/apps/swag/dns-conf
	# Already handled automatically: cloudflare, duckdns
	# See the doc in apps/reverse-proxy/apps/swag/dns-conf
	DNS_PROVIDER="cloudflare"
	# The token for your DNS provider (see apps/reverse-proxy/apps/swag/dns-conf)
	DNS_PROVIDER_TOKEN=""
    # DNS Propagation time (in second)
	DNS_PROPAGATION_TIME=30

	## DDNS

	# Optional: For  Dynu Only
	DNS_PROVIDER_USERNAME=""
	
	# Optional: For cloudflare only
	# On the homepage, on the account home, on the domain line, click "copy zone ID" (clickable dots at the right of the line)
	CLOUDFLARE_ZONE_ID=""

[sandbox] # apps/sandbox
	enabled=true

[vault] # apps/vault
	enabled=false

	VAULTWARDEN_ADMIN_TOKEN=""

[vpn] # apps/vpn
	enabled=true

[vscode-server] # apps/vscode-server
	enabled=false

	VSCODE_SERVER_PASSWORD=""

[whiteboard] # apps/whiteboard
	enabled=false
