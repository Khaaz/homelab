# nftables configuration equivalent to:
# iptables -P FORWARD ACCEPT
# iptables -t nat -A POSTROUTING -s 10.10.30.0/24 -o eth0 -j MASQUERADE
# iptables -t nat -A POSTROUTING -s 10.10.2.0/24 -o eth0 -j MASQUERADE
table inet filter {
  chain input {
    type filter hook input priority 0;
    policy drop;

    ct state established,related accept
    iifname "lo" accept
    tcp dport 22 accept
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
  }
  chain forward { 
    type filter hook forward priority 0; 
    policy accept; 
  }
  chain output { 
    type filter hook output priority 0; 
    policy accept; 
  }
}

table inet nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    policy accept;
    
    ip saddr 10.10.30.0/24 oifname "eth0" masquerade
    ip saddr 10.10.2.0/24 oifname "eth0" masquerade
  }
}
