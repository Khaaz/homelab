server:
    # Listen on all interfaces
    interface: 0.0.0.0
    access-control: 0.0.0.0/0 allow  # Allow public queries by default
    verbosity: 1
    do-not-query-localhost: no

    access-control-view: ${RP_IP}/32 srv
    access-control-view: ${JMP_IP}/32 mgmt

    #
    # ==== *.homelab ===
    #
    # Define a local zone for *.homelab with unrestricted access
    
    local-zone: "${INTERNAL_DOMAIN}." redirect
    local-data: "${INTERNAL_DOMAIN}. IN A ${HOST_LAN_IP}"  # IP host machine reverse proxy

# split-horizon: only allow access to DNS for RP VM (ip that have access to this view)
view:
    name: "srv"
    #
    # ==== *.srv.homelab ===
    #
    # Define a local zone for srv.homelab with restricted access
    local-zone: "srv.${INTERNAL_DOMAIN}." static

    # local-data: "cld.srv.${INTERNAL_DOMAIN}. IN A ${CLD_IP}" # IP host machine cloud
    # local-data: "ha.srv.${INTERNAL_DOMAIN}. IN A ${HA_IP}" # IP host machine home-automation
    # local-data: "im.srv.${INTERNAL_DOMAIN}. IN A ${IM_IP}" # IP host machine immich
    local-data: "mm.srv.${INTERNAL_DOMAIN}. IN A ${MM_IP}" # IP host machine media-management
    local-data: "ms.srv.${INTERNAL_DOMAIN}. IN A ${MS_IP}" # IP host machine media-server
    # local-data: "nas.srv.${INTERNAL_DOMAIN}. IN A ${NAS_IP}" # IP host machine nas
    # local-data: "nts.srv.${INTERNAL_DOMAIN}. IN A ${NTS_IP}" # IP host machine notes
    # local-data: "sbx.srv.${INTERNAL_DOMAIN}. IN A ${SBX_IP}" # IP host machine sanbox
    # local-data: "vlt.srv.${INTERNAL_DOMAIN}. IN A ${VLT_IP}" # IP host machine vault
    # local-data: "vsc.srv.${INTERNAL_DOMAIN}. IN A ${VSC_IP}" # IP host machine vscode-server
    # local-data: "wb.srv.${INTERNAL_DOMAIN}. IN A ${WB_IP}" # IP host machine whiteboard

# split-horizon: only allow access to DNS for JUMP VM (ip that have access to this view)
view:
    name: "mgmt"
    #
    # ==== *.mgmt.homelab ===
    #
    # Define a local zone for mgmt.homelab with restricted access
    local-zone: "mgmt.${INTERNAL_DOMAIN}." static

    # local-data: "cld.mgmt.${INTERNAL_DOMAIN}. IN A ${CLD_IP}" # IP host machine cloud
    local-data: "dns.mgmt.${INTERNAL_DOMAIN}. IN A ${DNS_IP}" # IP host machine dns
    local-data: "gw.mgmt.${INTERNAL_DOMAIN}. IN A ${GW_IP}" # IP host machine firewall-gw
    local-data: "mgmt.mgmt.${INTERNAL_DOMAIN}. IN A ${MGMT_IP}" # IP host machine firewall-mgmt
    local-data: "srv.mgmt.${INTERNAL_DOMAIN}. IN A ${SRV_IP}" # IP host machine firewall-srv
    # local-data: "ha.mgmt.${INTERNAL_DOMAIN}. IN A ${HA_IP}" # IP host machine home-automation
    # local-data: "im.mgmt.${INTERNAL_DOMAIN}. IN A ${IM_IP}" # IP host machine immich
    local-data: "mm.mgmt.${INTERNAL_DOMAIN}. IN A ${MM_IP}" # IP host machine media-management
    local-data: "ms.mgmt.${INTERNAL_DOMAIN}. IN A ${MS_IP}" # IP host machine media-server
    # local-data: "nas.mgmt.${INTERNAL_DOMAIN}. IN A ${NAS_IP}" # IP host machine nas
    # local-data: "nts.mgmt.${INTERNAL_DOMAIN}. IN A ${NTS_IP}" # IP host machine notes
    # local-data: "sbx.mgmt.${INTERNAL_DOMAIN}. IN A ${SBX_IP}" # IP host machine sanbox
    # local-data: "vlt.mgmt.${INTERNAL_DOMAIN}. IN A ${VLT_IP}" # IP host machine vault
    local-data: "vpn.mgmt.${INTERNAL_DOMAIN}. IN A ${VPN_IP}" # IP host machine vault
    # local-data: "vsc.mgmt.${INTERNAL_DOMAIN}. IN A ${VSC_IP}" # IP host machine vscode-server
    # local-data: "wb.mgmt.${INTERNAL_DOMAIN}. IN A ${WB_IP}" # IP host machine whiteboard

forward-zone:
    name: "."  # Catch all queries not handled locally 
    forward-addr: 1.1.1.1  # Cloudflare primary DNS
    forward-addr: 8.8.8.8  # Google primary DNS
