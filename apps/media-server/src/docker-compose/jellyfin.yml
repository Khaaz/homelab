services:
  jellyfin-pre-start:
    image: alpine:3.22
    container_name: jellyfin-pre-start
    networks:
      media-server:
        ipv4_address: ${MEDIA_SERVER_DOCKER_SUBNET:?err}.41
    command:
      - /bin/sh
      - -c
      - |
        /scripts/parse_file.sh /_setup/templates/system.xml /config/system.xml false
        /scripts/parse_file.sh /_setup/templates/branding.xml /config/branding.xml
        /scripts/parse_file.sh /_setup/templates/plugins/sso.xml /config/data/plugins/configurations/SSO-Auth.xml
        /scripts/parse_file.sh /_setup/templates/plugins/open-subtitles.xml /config/data/plugins/configurations/Jellyfin.Plugin.OpenSubtitles.xml
    volumes:
      - ${APPS_FOLDER:?err}/jellyfin/config:/config # config
      - ${APPS_FOLDER:?err}/jellyfin/_setup:/_setup # setup     
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - MEDIA_SERVER_NAME=${MEDIA_SERVER_NAME:?err}
      - INTERNAL_DOMAIN=${INTERNAL_DOMAIN:?err}
      - EXTERNAL_DOMAIN=${EXTERNAL_DOMAIN:?err}
      - JELLYFIN_OIDC_CLIENT_SECRET=${JELLYFIN_OIDC_CLIENT_SECRET:?err}
      - JELLYFIN_EXTERNAL_OIDC_CLIENT_SECRET=${JELLYFIN_EXTERNAL_OIDC_CLIENT_SECRET:?err}
      # optional
      - JELLYFIN_OPENSUBTITLES_USERNAME=${JELLYFIN_OPENSUBTITLES_USERNAME}
      - JELLYFIN_OPENSUBTITLES_PASSWORD=${JELLYFIN_OPENSUBTITLES_PASSWORD}
      
  # Jellyfin - Media Server
  jellyfin:
    image: jellyfin/jellyfin:10.11
    container_name: jellyfin
    restart: unless-stopped
    networks:
      media-server:
        ipv4_address: ${MEDIA_SERVER_DOCKER_SUBNET:?err}.11
    depends_on:
      jellyfin-pre-start:
        condition: service_completed_successfully
    # user: ${PUID:?err}:${PGID:?err}
    # devices is defined in the jellyfin.override file that is included in proxmox only
    # devices:
    #   - /dev/dri/renderD129:/dev/dri/renderD128 
    ports:
      - ${PORT_UI_JELLYFIN:?err}:8096        # HTTP WebUI
      - 7359:7359/udp                        # Service Discovery
    volumes:
      - ${APPS_FOLDER:?err}/jellyfin/config:/config # config
      - ${APPS_FOLDER:?err}/jellyfin/workdir:/workdir # workdir
      - ${APPS_FOLDER:?err}/jellyfin/_setup:/_setup # setup     
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
      - ${DATA_FOLDER:?err}/media:/data/media # data (media)
      - ${DATA_FOLDER:?err}/transcode:/transcode # data (transcode)
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - JELLYFIN_CONFIG_DIR=/config
      - JELLYFIN_DATA_DIR=/config/data
      - JELLYFIN_CACHE_DIR=/workdir/cache
      - JELLYFIN_LOG_DIR=/workdir/log
      # setup
      - JELLYFIN_PUBLISHED_SERVER_URL=${EXTERNAL_DOMAIN:?err}
    post_start:
      - command: /scripts/trust_certificate.sh "${INTERNAL_DOMAIN:?err}"
        user: root
      - command: /_setup/bash/init.sh
        user: root
        environment:
          - JELLYFIN_ADMIN_PASSWORD=${JELLYFIN_ADMIN_PASSWORD:?err}
