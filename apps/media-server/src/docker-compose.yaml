# secret.env file with secret env var:
# ctrl+f: overriden

networks:
  mediaserver:
    name: mediaserver
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: ${DOCKER_SUBNET:?err}
        gateway: ${DOCKER_GATEWAY:?err}

services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPS_FOLDER:?err}/portainer:/data
    ports:
      - "${PORT_UI_PORTAINER:?err}:9443"
    network_mode: bridge

###########################################################################
###########################################################################
## CORE
###########################################################################
###########################################################################

# Gluetun - VPN Client
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888/tcp"                         # Gluetun Local Network HTTP proxy
      - "8388:8388/tcp"                         # Gluetun Local Network Shadowsocks
      - "8388:8388/udp"                         # Gluetun Local Network Shadowsocks
      - ${GLUETUN_CONTROL_PORT:?err}:${GLUETUN_CONTROL_PORT:?err} # Gluetun Status Port

      - "${PORT_SERVICE_PROWLARR:?err}:9696"      # WebUI Portal: Prowlarr
      - "${PORT_UI_FLARESOLVERR:?err}:8191"        # Service Port: FlareSolverr
      - "${PORT_UI_QBITTORRENT:?err}:${PORT_UI_QBITTORRENT:?err}"   # WebUI Portal: qBittorrent
      - "${PORT_SERVICE_QBITTORRENT:?err}:6881"                # Transmission Torrent Port
      # - "${WEBUI_PORT_UI_SABNZBD:?err}:8080"       # WebUI Portal: SABnzbd
      - "${PORT_UI_BAZARR:?err}:6767"        # WebUI Portal: Bazarr
      - "${PORT_UI_RADARR:?err}:7878"        # WebUI Portal: Radarr
      - "${PORT_UI_RADARR4k:?err}:7879"      # WebUI Portal: Radarr4k
      - "${PORT_UI_SONARR:?err}:8989"        # WebUI Portal: Sonarr
      - "${PORT_UI_HOMARR:?err}:7575"        # WebUI Portal: Homarr
      - "${PORT_UI_MAINTAINERR:?err}:6246"   # WebUI Portal: Maintainerr
      - "${PORT_UI_OVERSEER:?err}:5055"      # WebUI Portal: Overseer
      - "${PORT_UI_PLEX:?err}:32400"         # WebUI Portal: Plex

#      - 1900:1900/udp                           # DNLA Service       (Clashes with Synology: SSPD "File Services" --> "Advanced")
#      - 5353:5353/udp                           # Plex Network Port  (Clashes with Synology: Bonjour "File Services" --> "Advanced")
      - 8324:8324                               # Plex Network Port
      - 32410:32410/udp                         # Plex Network Port
      - 32412:32412/udp                         # Plex Network Port
      - 32413:32413/udp                         # Plex Network Port
      - 32414:32414/udp                         # Plex Network Port
      - 32469:32469                             # Plex Network Port
      
      # - "${PORT_UI_FILEBOT:?err}:${PORT_UI_FILEBOT:?err}"           # WebUI Portal: Filebot
      # - "${TDARR_SERVER_PORT:?err}:${TDARR_SERVER_PORT:?err}"   # Tdarr: Server Port
      # - "${PORT_UI_TDARR:?err}:${PORT_UI_TDARR:?err}"     # Tdarr: WebUI Portal
    volumes:
      - ${APPS_FOLDER:?err}/gluetun:/gluetun
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:?err}
      - OPENVPN_USER=${VPN_USERNAME:?err}
      - OPENVPN_PASSWORD=${VPN_PASSWORD:?err}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - SERVER_CITIES=${SERVER_CITIES}
      - SERVER_HOSTNAMES=${SERVER_HOSTNAMES}
      - SERVER_CATEGORIES=${SERVER_CATEGORIES}
      - FIREWALL_OUTBOUND_SUBNETS=${LOCAL_SUBNET:?err}
      - OPENVPN_CUSTOM_CONFIG=${OPENVPN_CUSTOM_CONFIG}
      - HTTP_CONTROL_SERVER_ADDRESS=:${GLUETUN_CONTROL_PORT:?err}
      - VPN_TYPE=${VPN_TYPE}
      - VPN_ENDPOINT_IP=${VPN_ENDPOINT_IP}
      - VPN_ENDPOINT_PORT=${VPN_ENDPOINT_PORT}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - HTTPPROXY=on
      - SHADOWSOCKS=on
    networks:
      - mediaserver

###########################################################################
###########################################################################
## CORE - ARR [download]
###########################################################################
###########################################################################

# Prowlarr - Indexer and Search Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    restart: unless-stopped
    volumes:
      - ${APPS_FOLDER:?err}/prowlarr:/config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:prowlarr
      - TP_THEME=${TP_THEME:?err}
      # setup env vars
      - API_KEY_PROWLARR=${API_KEY_PROWLARR:?err}
    post_start:
      - command: /scripts/parse-file.sh /config/_setup/templates/config.xml /config/config.xml
        user: root
      - command: /scripts/execute-sql.sh /config/prowlarr.db /config/_setup/sql/init.sql
        user: root

# Flaresolverr - Cloudflare Proxy Server 
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE:?err}

# Qbittorrent - Torrent client
# default user/password: admin/admin!
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    restart: unless-stopped
    volumes:
      - ${APPS_FOLDER:?err}/qbittorrent:/config
      - ${DATA_FOLDER:?err}/torrents:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=${PORT_UI_QBITTORRENT:?err}

