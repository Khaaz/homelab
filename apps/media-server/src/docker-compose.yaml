# Homarr - Application Dashboard
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "container:gluetun"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPS_FOLDER:?err}/homarr/configs:/app/data/configs
      - ${APPS_FOLDER:?err}/homarr/icons:/app/public/icons
      - ${APPS_FOLDER:?err}/homarr/data:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}

# Maintainerr - Management Dashboard
  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:latest
    container_name: maintainerr
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "container:gluetun"
    restart: unless-stopped
    user:  ${PUID:?err}:${PGID:?err}
    volumes:
      - '${APPS_FOLDER:?err}/maintainerr/config:/opt/data'
    environment:
      - TZ=${TIMEZONE:?err}
#      - DEBUG=true # uncomment (remove the hashtag) to enable debug logs

# Overseer - Media Management
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:readarr
      - TP_THEME=${TP_THEME:?err}
    volumes:
      - '${APPS_FOLDER:?err}/overseerr/config:/config'

# Plex - Media Server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    restart: unless-stopped
# Add Configurations for GPU Hardware Rendering Here:
#    devices:
#      - /dev/dri/renderD128:/dev/dri/renderD128
#      - /dev/dri/card0:/dev/dri/card0
    volumes:
      - ${APPS_FOLDER:?err}/plex:/config
      - ${DATA_FOLDER:?err}/media:/data/media
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
# Ports are disabled in containers when they are connected to VPN, as the
# Gluetun container manages the ports for containers that connect via VPN
