kernel: standard
specs:
  cores: 2
  ram_size: 4096 # MB
  disk_size: 25 # GB
  additional_disks: []
  # PCI Passthrough: Intel iGPU for Plex hardware transcoding (Quick Sync)
  # Find your Intel iGPU PCI address with: lspci | grep -i vga
  # Common PCI address: 0000:00:02.0 (Intel Integrated Graphics)
  # We use 'mapping' instead of 'id' because direct PCI passthrough requires root
  # The mapping 'pci_igpu_mapping' is created by Ansible playbook 4.additional-setup
  pci_devices:
    - mapping: "pci_igpu_mapping"  # Use mapping for non-root access
    # Alternative (requires root):
    # - id: "0000:00:02.0"
order_tier: 3
config:
  docker: true
  router: false
  routes:
    - network: 10.10.32.0/24 # intern
      via: 10.10.31.2 # firewall-srv
  dns_servers: [10.10.1.200, 1.1.1.1, 8.8.8.8]
nics:
  - bridge: vmbr3 # srv
    vlan: 31 # extern
    ipv4: 10.10.31.11/24
    gateway: 10.10.31.1
# Mount NAS /media share
nas:
  - ip: "10.10.32.30"
    mount_path: "/mnt/data"
    nfs_export: "/media"
  - ip: "10.10.32.31"
    mount_path: "/mnt/apps-data"
    nfs_export: "/apps"
