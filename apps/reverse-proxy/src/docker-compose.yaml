networks:
  reverse-proxy:
    name: reverse-proxy
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.0/24"
        gateway: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.1"

services:

  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer
  #   restart: always
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ${APPS_FOLDER:?err}/portainer:/data
  #   ports:
  #     - "${PORT_UI_PORTAINER:?err}:9443"
  #   network_mode: bridge

  authelia-pre-start:
    image: alpine:latest
    container_name: authelia-pre-start
    command: ["/bin/sh", "-c", "/scripts/parse-folder.sh /_setup/templates /config"]
    networks:
      reverse-proxy:
        ipv4_address: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.33"
    volumes:
      - ${APPS_FOLDER:?err}/authelia:/config # config
      - ${APPS_FOLDER:?err}/authelia/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      # setup
      - DOMAIN=${INTERNAL_DOMAIN:?err}
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:?err}
      - AUTHELIA_ENCRYPTION_KEY=${AUTHELIA_ENCRYPTION_KEY:?err}
      - USER_NAME=${AUTHELIA_USER_NAME:?err}
      - USER_PASSWORD=${AUTHELIA_USER_PASSWORD:?err}
      - USER_EMAIL=${AUTHELIA_USER_EMAIL:?err}

# Authelia - Multi-factor authentication portal
  authelia:
    image: ghcr.io/authelia/authelia:latest
    container_name: authelia
    restart: unless-stopped
    networks:
      reverse-proxy:
        ipv4_address: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.12"
    depends_on:
      authelia-pre-start:
        condition: service_completed_successfully 
    ports:
      - ${PORT_UI_AUTHELIA:?err}:9091
    volumes:
      - ${APPS_FOLDER:?err}/authelia:/config # config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}

# SWAG - Reverse proxy with Certbot, for Let's Encrypt / ZeroSSL
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.11
    dns:
      - "${REVERSE_PROXY_DOCKER_SUBNET:?err}.10"  # Custom DNS server (Unbound container IP)
    ports:
      - 80:80
      - 443:443
    volumes:
      - ${APPS_FOLDER:?err}/swag:/config:rw # config
      - ${APPS_FOLDER:?err}/swag/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - URL=${EXTERNAL_DOMAIN:?err}
      - SUBDOMAINS=${SUBDOMAINS}
      - VALIDATION=${VALIDATION:?err}
      - DNSPLUGIN=${DNSPLUGIN}
      - ONLY_SUBDOMAINS=${ONLY_SUBDOMAINS}
      # setup
      - EXTERNAL_DOMAIN=${EXTERNAL_DOMAIN:?err}
      - INTERNAL_DOMAIN=${INTERNAL_DOMAIN:?err}
      - MS_DOMAIN=${MEDIA_SERVER_DOMAIN:?err}
      - MM_DOMAIN=${MEDIA_MANAGEMENT_DOMAIN:?err}
      - PORT_UI_AUTHELIA=${PORT_UI_AUTHELIA:?err}
      - PORT_UI_PROWLARR=${PORT_UI_PROWLARR:?err}
      - PORT_UI_QBITTORRENT=${PORT_UI_QBITTORRENT:?err}
      - PORT_UI_BAZARR=${PORT_UI_BAZARR:?err}
      - PORT_UI_RADARR=${PORT_UI_RADARR:?err}
      - PORT_UI_RADARR4K=${PORT_UI_RADARR4K:?err}
      - PORT_UI_SONARR=${PORT_UI_SONARR:?err}
      - PORT_UI_SONARR4K=${PORT_UI_SONARR4K:?err}
      - PORT_UI_HOMARR=${PORT_UI_HOMARR:?err}
      - PORT_UI_MAINTAINERR=${PORT_UI_MAINTAINERR:?err}
      - PORT_UI_OVERSEERR=${PORT_UI_OVERSEERR:?err}
      - PORT_UI_PLEX=${PORT_UI_PLEX:?err}
      - PORT_UI_NEXTCLOUD=${PORT_UI_NEXTCLOUD:?err}
    post_start:
      - command: /scripts/parse-folder.sh /_setup/templates /config
        user: root

  unbound-pre-start:
    image: alpine:latest
    container_name: unbound-pre-start
    command: ["/bin/sh", "-c", "/scripts/parse-file.sh /_setup/templates/unbound.conf /opt/unbound/etc/unbound/unbound.conf"]
    networks:
      reverse-proxy:
        ipv4_address: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.30"
    volumes:
      - ${APPS_FOLDER:?err}/unbound:/opt/unbound/etc/unbound # config
      - ${APPS_FOLDER:?err}/unbound/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      # setup
      - DOCKER_SUBNET=${REVERSE_PROXY_DOCKER_SUBNET:?err}
      - INTERNAL_DOMAIN=${INTERNAL_DOMAIN:?err}
      - RP_HOST_IP=${REVERSE_PROXY_HOST_IP:?err}
      - MM_HOST_IP=${MEDIA_MANAGEMENT_HOST_IP:?err}
      - MS_HOST_IP=${MEDIA_SERVER_HOST_IP:?err}
      - NX_HOST_IP=${NEXTCLOUD_HOST_IP:?err}
    post_start:
      - command: /scripts/parse-file.sh /_setup/templates/unbound.conf /opt/unbound/etc/unbound/unbound.conf
        user: root

# DNSMask - DNS server for local resolution
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: unless-stopped
    networks:
      reverse-proxy:
        ipv4_address: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.10"
    depends_on:
      unbound-pre-start:
        condition: service_completed_successfully 
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ${APPS_FOLDER:?err}/unbound:/opt/unbound/etc/unbound # config

# minica - Generate self signed certificat
  minica:
    container_name: minica
    build:
      context: ${APPS_FOLDER:?err}/ca
      dockerfile: Dockerfile
      no_cache: true
    networks:
      reverse-proxy:
        ipv4_address: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.20"
    volumes:
      - ${APPS_FOLDER:?err}/ca/certs:/app/certs
      - ${APPS_FOLDER:?err}/ca/scripts:/scripts
      - ${APPS_FOLDER:?err}/swag/keys-private:/swag/keys-private
      - ${APPS_FOLDER:?err}/swag/www:/swag/www
    environment:
      - DOMAIN=${INTERNAL_DOMAIN}

# DDNS-Updater - Dynamically update registrar (CF / google etc) with the host ip address to correctly map domain -> ip
  ddns-updater:
    image: qmcgaw/ddns-updater:latest
    container_name: ddns-updater
    restart: unless-stopped
    networks:
      reverse-proxy:
        ipv4_address: "${REVERSE_PROXY_DOCKER_SUBNET:?err}.21"
    user: ${PUID:?err}:${PGID:?err}
    ports:
      - ${PORT_UI_DDNS_UPDATER:?err}:${PORT_UI_DDNS_UPDATER:?err}/tcp
    volumes:
      - ${APPS_FOLDER:?err}/ddns-updater:/updater/data
    environment:
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - CONFIG=
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - HTTP_TIMEOUT=10s
      # Web UI
      - LISTENING_ADDRESS=:${PORT_UI_DDNS_UPDATER:?err}
      - ROOT_URL=/
      # Backup
      - BACKUP_PERIOD=0 # 0 to disable
      - BACKUP_DIRECTORY=/updater/data
      # Other
      - LOG_LEVEL=info
      - LOG_CALLER=hidden
      - SHOUTRRR_ADDRESSES=
