  #   ports:
  #     - "${PORT_UI_PORTAINER:?err}:9443"
  #   network_mode: bridge

###########################################################################
###########################################################################
## Authentification / DNS
###########################################################################
###########################################################################

# Authelia - Multi-factor authentication portal
  authelia:
    image: ghcr.io/authelia/authelia:latest
    container_name: authelia
    volumes:
      - ${APPS_FOLDER:?err}/authelia:/config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
    restart: unless-stopped
    networks:
      reverseproxy:
        ipv4_address: "${DOCKER_SUBNET:?err}.12"

# SWAG - Reverse proxy with Certbot, for Let's Encrypt / ZeroSSL
  swag:
    image: lscr.io/linuxserver/swag:latest
    container_name: swag
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    volumes:
      - ${APPS_FOLDER:?err}/swag:/config:rw
    ports:
      - 80:80
      - 443:443
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - URL=${DOMAINNAME:?err}
      - SUBDOMAINS=${SUBDOMAINS}
      - VALIDATION=${VALIDATION:?err}
      - DNSPLUGIN=${DNSPLUGIN}
      - ONLY_SUBDOMAINS=${ONLY_SUBDOMAINS}
      # - EXTRA_DOMAINS=${EXTRA_DOMAINS}
      # - STAGING=${STAGING}
    networks:
      reverseproxy:
        ipv4_address: ${DOCKER_SUBNET:?err}.11
    dns:
      - "${DOCKER_SUBNET:?err}.10"  # Custom DNS server (Unbound container IP)

# DNSMask - DNS server for local resolution
  unbound:
    image: mvance/unbound:latest
    container_name: unbound
    restart: unless-stopped
    expose:
      - "53"
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    volumes:
      - ${APPS_FOLDER:?err}/unbound:/opt/unbound/etc/unbound
    networks:
      reverseproxy:
        ipv4_address: "${DOCKER_SUBNET:?err}.10"
  
  minica:
    container_name: minica
    build:
      context: ${APPS_FOLDER:?err}/ca
      dockerfile: Dockerfile
      no_cache: true
    volumes:
      - ${APPS_FOLDER:?err}/ca:/app/certs
    environment:
      - DOMAIN=l.ab

# DDNS-Updater - Dynamically update registrar (CF / google etc) with the host ip address to correctly map domain -> ip
  ddns-updater:
    image: qmcgaw/ddns-updater:latest
    container_name: ddns-updater
    restart: always
    user: ${PUID:?err}:${PGID:?err}
    volumes:
      - ${APPS_FOLDER:?err}/ddns-updater:/updater/data
    ports:
      - ${PORT_UI_DDNS_UPDATER:?err}:${PORT_UI_DDNS_UPDATER:?err}/tcp
    environment:
#      - PUID=${PUID:?err}    # Not used in DDNS-Updater - see above:   user: ${PUID:?err}:${PGID:?err}
#      - PGID=${PGID:?err}    # Not used in DDNS-Updater - see above:   user: ${PUID:?err}:${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - CONFIG=
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - HTTP_TIMEOUT=10s
      # Web UI
      - LISTENING_ADDRESS=:${PORT_UI_DDNS_UPDATER:?err}
      - ROOT_URL=/
      # Backup
      - BACKUP_PERIOD=0 # 0 to disable
      - BACKUP_DIRECTORY=/updater/data
      # Other
      - LOG_LEVEL=info
      - LOG_CALLER=hidden
      - SHOUTRRR_ADDRESSES=
    networks:
      reverseproxy:
        ipv4_address: "${DOCKER_SUBNET:?err}.20"