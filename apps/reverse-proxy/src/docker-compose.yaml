networks:
  reverse-proxy:
    name: reverse-proxy
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.0/24
          gateway: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.1
services:
  # Authelia - Pre-start
  authelia-pre-start:
    image: alpine:3.22
    container_name: authelia-pre-start
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.32
    command:
      - /bin/sh
      - -c
      - /scripts/parse_folder.sh /_setup/templates /config
    volumes:
      - ${APPS_FOLDER:?err}/authelia:/config # config
      - ${APPS_FOLDER:?err}/authelia/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      # setup
      - DOMAIN=${INTERNAL_DOMAIN:?err}
      - AUTHELIA_JWT_SECRET=${AUTHELIA_JWT_SECRET:?err}
      - AUTHELIA_ENCRYPTION_KEY=${AUTHELIA_ENCRYPTION_KEY:?err}
      - USER_NAME=${AUTHELIA_USER_NAME:?err}
      - USER_PASSWORD=${AUTHELIA_USER_PASSWORD:?err}
      - USER_EMAIL=${AUTHELIA_USER_EMAIL:?err}
      - AUTHELIA_USER_FAMILY_PASSWORD=${AUTHELIA_USER_FAMILY_PASSWORD:?err}
  
  # Authelia - Multi-factor authentication portal
  authelia:
    image: ghcr.io/authelia/authelia:4
    container_name: authelia
    restart: unless-stopped
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.12
    depends_on:
      authelia-pre-start:
        condition: service_completed_successfully
    ports:
      - ${PORT_UI_AUTHELIA:?err}:9091
    volumes:
      - ${APPS_FOLDER:?err}/authelia:/config # config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
  
  # SWAG - Reverse proxy with Certbot, for Let's Encrypt / ZeroSSL
  swag:
    image: lscr.io/linuxserver/swag:5.1.0
    container_name: swag
    depends_on:
      minica:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.11
    dns:
      -  ${DNS_IP:?err} # Custom DNS server (DNS VM (Unbound))
    ports:
      - 80:80
      - 443:443
    volumes:
      - ${APPS_FOLDER:?err}/swag:/config:rw # config
      - ${APPS_FOLDER:?err}/swag/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - PROPAGATION=${DNS_PROPAGATION_TIME:?err}
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - URL=${EXTERNAL_DOMAIN:?err}
      - SUBDOMAINS=${SUBDOMAINS}
      - VALIDATION=${VALIDATION:?err}
      - DNSPLUGIN=${DNS_PROVIDER}
      - ONLY_SUBDOMAINS=${ONLY_SUBDOMAINS}
      # setup
      - EXTERNAL_DOMAIN=${EXTERNAL_DOMAIN:?err}
      - INTERNAL_DOMAIN=${INTERNAL_DOMAIN:?err}
      - DNS_PROVIDER_TOKEN=${DNS_PROVIDER_TOKEN:?err}
      # ports
      - PORT_UI_PROXMOX=${PORT_UI_PROXMOX:?err}
      - HOST_LAN_IP=${HOST_LAN_IP:?err}
      # - RP
      - PORT_UI_AUTHELIA=${PORT_UI_AUTHELIA:?err}
      # - HA
      - PORT_UI_HOME_ASSISTANT=${PORT_UI_HOME_ASSISTANT:?err}
      # - IM
      - PORT_UI_IMMICH=${PORT_UI_IMMICH:?err}
      # - MM
      - PORT_UI_PROWLARR=${PORT_UI_PROWLARR:?err}
      - PORT_UI_QBITTORRENT=${PORT_UI_QBITTORRENT:?err}
      - PORT_UI_BAZARR=${PORT_UI_BAZARR:?err}
      - PORT_UI_RADARR=${PORT_UI_RADARR:?err}
      - PORT_UI_RADARR4K=${PORT_UI_RADARR4K:?err}
      - PORT_UI_SONARR=${PORT_UI_SONARR:?err}
      - PORT_UI_SONARR4K=${PORT_UI_SONARR4K:?err}
      - PORT_UI_HOMARR=${PORT_UI_HOMARR:?err}
      - PORT_UI_MAINTAINERR=${PORT_UI_MAINTAINERR:?err}
      # - MS
      - PORT_UI_OVERSEERR=${PORT_UI_OVERSEERR:?err}
      - PORT_UI_PLEX=${PORT_UI_PLEX:?err}
      - PORT_UI_JELLYFIN=${PORT_UI_JELLYFIN:?err}
      # - NC
      - PORT_UI_NEXTCLOUD=${PORT_UI_NEXTCLOUD:?err}
      # - VW
      - PORT_UI_VAULTWARDEN=${PORT_UI_VAULTWARDEN:?err}
      # - VSC
      - PORT_UI_VSCODE_SERVER=${PORT_UI_VSCODE_SERVER:?err}
    post_start:
      - command: /scripts/parse_folder.sh /_setup/templates /config
        user: root
        environment:
          - PUID=${PUID:?err}
          - PGID=${PGID:?err}
  
  # Minica - Generate self signed certificat
  minica:
    container_name: minica
    build:
      context: ${APPS_FOLDER:?err}/ca
      dockerfile: Dockerfile
      no_cache: true
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.31
    volumes:
      - ${APPS_FOLDER:?err}/ca/certs:/app/certs
      - ${APPS_FOLDER:?err}/swag/keys-private:/swag/keys-private
      - ${APPS_FOLDER:?err}/swag/www:/swag/www
    environment:
      - DOMAIN=${INTERNAL_DOMAIN}
      - ROOT_CN=${ROOT_CA_COMMON_NAME:?err}
  
  # DDNS-Updater - Pre-start
  ddns-updater-pre-start:
    image: alpine:3.20
    container_name: ddns-updater-pre-start
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.33
    command:
      - /bin/sh
      - -c
      - /scripts/parse_file.sh /_setup/templates/config.${DNS_PROVIDER:?err}.json /updater/data/config.json
    volumes:
      - ${APPS_FOLDER:?err}/ddns-updater:/updater/data # config
      - ${APPS_FOLDER:?err}/ddns-updater/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      # setup
      - EXTERNAL_DOMAIN=${EXTERNAL_DOMAIN:?err}
      - DNS_PROVIDER_TOKEN=${DNS_PROVIDER_TOKEN:?err}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID}

  # DDNS-Updater - Dynamically update registrar (CF / google etc) with the host ip address to correctly map domain -> ip
  ddns-updater:
    image: qmcgaw/ddns-updater:2
    container_name: ddns-updater
    restart: unless-stopped
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.22
    depends_on:
      ddns-updater-pre-start:
        condition: service_completed_successfully
    user: ${PUID:?err}:${PGID:?err}
    ports:
      - ${PORT_UI_DDNS_UPDATER:?err}:8000/tcp
    volumes:
      - ${APPS_FOLDER:?err}/ddns-updater:/updater/data # config
      - ${APPS_FOLDER:?err}/ddns-updater/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - CONFIG=
      - PERIOD=5m
      - UPDATE_COOLDOWN_PERIOD=5m
      - PUBLICIP_FETCHERS=all
      - PUBLICIP_HTTP_PROVIDERS=all
      - PUBLICIPV4_HTTP_PROVIDERS=all
      - PUBLICIPV6_HTTP_PROVIDERS=all
      - PUBLICIP_DNS_PROVIDERS=all
      - PUBLICIP_DNS_TIMEOUT=3s
      - HTTP_TIMEOUT=10s
      # Web UI
      - LISTENING_ADDRESS=:8000
      - ROOT_URL=/
      # Backup
      - BACKUP_PERIOD=0 # 0 to disable
      - BACKUP_DIRECTORY=/updater/data
      # Other
      - LOG_LEVEL=info
      - LOG_CALLER=hidden
      - SHOUTRRR_ADDRESSES=

  # Homer - Dashboard
  # generic service name for internal.conf to work out of the box
  # generic port 8080 for internal.conf to work out of the box
  dashboard:
    image: b4bz/homer:v25.10.1
    container_name: homer
    restart: unless-stopped
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.21
    user: ${PUID:?err}:${PGID:?err}
    ports:
      - 8080:8080
    volumes:
      - ${APPS_FOLDER:?err}/homer:/www/assets
      - ${APPS_FOLDER:?err}/homer/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - INIT_ASSETS=1 # default, requires the config directory to be writable for the container user (see user option)
      - INTERNAL_DOMAIN=${INTERNAL_DOMAIN:?err}
    post_start:
      - command: /scripts/parse_file.sh /_setup/templates/config.yml /www/assets/config.yml
        user: root
        environment:
          - PUID=${PUID:?err}
          - PGID=${PGID:?err}

  # Portainer Agent - for remote portainer management
  portainer-agent:
    image: portainer/agent:2.35.0-alpine
    container_name: portainer-agent
    restart: unless-stopped
    networks:
      reverse-proxy:
        ipv4_address: ${REVERSE_PROXY_DOCKER_SUBNET:?err}.09
    ports:
      - "19001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      - AGENT_CLUSTER_ADDR=tasks.portainer-agent
      - CAP_HOST_MANAGEMENT=1
