networks:
  reverseproxy:
    name: reverseproxy
    driver: bridge
    ipam:
      driver: default
      config:
      - subnet: "${DOCKER_SUBNET:?err}.0/24"
        gateway: "${DOCKER_SUBNET:?err}.1"

services:

  # portainer:
  #   image: portainer/portainer-ce:latest
  #   container_name: portainer
