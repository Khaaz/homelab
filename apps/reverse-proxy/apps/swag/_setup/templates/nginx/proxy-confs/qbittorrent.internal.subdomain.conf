## Version 2024/07/16
# Api and related location bypasses are now commented out by default
# due to users easily misconfiguring qbittorrent to allow
# public access through the api endpoint by including SWAG in
# "Bypass authentication for clients in whitelisted IP subnets",
# which results in all connections through SWAG to be considered
# local and bypassing auth, which also applies to qbittorrent's
# api endpoint (webui api)
# enable at your own risk

server {
	listen 443 ssl;
	listen [::]:443 ssl;

	server_name qbittorrent.${INTERNAL_DOMAIN} qbit.${INTERNAL_DOMAIN} torrents.${INTERNAL_DOMAIN};

	include /config/nginx/htaccess.conf;
	
	include /config/nginx/ssl-private.conf;

	client_max_body_size 0;

	# enable for Authelia (requires authelia-location.conf in the location block)
	include /config/authelia/authelia-server.conf;

	location / {
		# enable for Authelia (requires authelia-server.conf in the server block)
		include /config/authelia/authelia-location.conf;

		include /config/nginx/proxy.conf;
		include /config/nginx/resolver.conf;
		set $upstream_app mm.srv.${INTERNAL_DOMAIN};
		set $upstream_port ${PORT_UI_QBITTORRENT};
		set $upstream_proto http;
		proxy_pass $upstream_proto://$upstream_app:$upstream_port;

		proxy_set_header Referer '';
		proxy_set_header Host $upstream_app:$upstream_port;
		proxy_set_header X-Forwarded-Host $host;
	}

