## Version 2025/10/21
# make sure your jellyfin container is named "jellyfin"
# make sure your DNS has a CNAME for jellyfin (e.g., jellyfin.${INTERNAL_DOMAIN})
# if jellyfin is running in bridge mode and the container is named "jellyfin", this config should work as-is
# otherwise, replace "set $upstream_app jellyfin;" with the container name or the host IP
# in Jellyfin admin panel > Networking, fill in "Public HTTPS Base URL" with "https://jellyfin.yourdomain.url:443"

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name jellyfin.${INTERNAL_DOMAIN};

    include /config/nginx/htaccess.conf;
    include /config/nginx/ssl-private.conf;

    client_max_body_size 0;
    proxy_redirect off;
    proxy_buffering off;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        # Change this to the container name or host IP if needed
        set $upstream_app ms.srv.${INTERNAL_DOMAIN};
        set $upstream_port ${PORT_UI_JELLYFIN};
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # WebSocket support (essential for Jellyfin)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Disable buffering for media streams
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Optional: Redirect HTTP to HTTPS
    error_page 497 https://$host$request_uri;
}

# Optionally handle HTTP if you have a port 80 listener in a separate config
