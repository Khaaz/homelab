server:
    # Listen on all interfaces
    interface: 0.0.0.0
    access-control: 0.0.0.0/0 allow  # Allow public queries by default
    verbosity: 1
    do-not-query-localhost: no

    access-control-view: 172.18.1.11/32 intra

    #
    # ==== *.homelab ===
    #
    # Define a local zone for *.homelab with unrestricted access
    
    local-zone: "l.ab." redirect
    local-data: "l.ab. IN A 192.168.1.20"  # IP host machine reverse proxy

view:
    name: "intra"

    #
    # ==== *.intra.homelab ===
    #
    # Define a local zone for intra.homelab with restricted access
    local-zone: "intra.l.ab." static

    local-data: "ms.intra.l.ab. IN A 192.168.1.20" # IP host machine plex
    local-data: "mm.intra.l.ab. IN A 192.168.1.20" # IP host machine media
    local-data: "ha.intra.l.ab. IN A 192.168.1.20" # IP host machine ha

forward-zone:
    name: "."  # Catch all queries not handled locally 
    forward-addr: 1.1.1.1  # Cloudflare primary DNS
    forward-addr: 8.8.8.8  # Google primary DNS
