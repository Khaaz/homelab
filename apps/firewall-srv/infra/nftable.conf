table inet filter {
	chain input {
		type filter hook input priority 0; 
		policy drop;

		iifname lo accept
		ct state established,related accept

		# Allow ping and other ICMP control (v4/v6)
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept

		# Allow SSH (22/tcp) from mgmt
		ip saddr 10.10.31.9 tcp dport 22 accept # from mgmt
		ip saddr 10.10.32.9 tcp dport 22 accept # from mgmt
	}

	chain forward {
		type filter hook forward priority 0; 
		policy drop;

		# Allow return traffic for forwarded flows
		ct state established,related accept

		# 10.10.31.0/24 <-> 10.10.32.0/24
		# extern -> intern 
		ip saddr 10.10.31.0/24 ip daddr 10.10.32.0/24 accept
		# intern -> extern
		ip saddr 10.10.32.0/24 ip daddr 10.10.31.0/24 accept
	}

	chain output {
		type filter hook output priority 0; 
		policy accept;
	}
}
