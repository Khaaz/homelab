flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; 
		policy drop;

		iifname lo accept
		ct state established,related accept
		ct state invalid drop
		
		# Allow ping and other ICMP control (v4/v6)
		ip protocol icmp accept
		ip6 nexthdr icmpv6 accept

		# Allow SSH (22/tcp) from mgmt
		ip saddr 10.10.32.9 tcp dport 22 accept # from mgmt
		tcp dport 22 drop # from everyone

		# Allow NFS from srv (intern and extern) networks
        ip saddr { 10.10.31.0/24, 10.10.32.0/24 } tcp dport 2049 accept

		# Allow NFS from LAN
		ip saddr 192.168.1.0/24 tcp dport 2049 accept
		# Allow Samba (nfs) from LAN
		ip saddr 192.168.1.0/24 tcp dport 445 accept
	}

	chain forward {
		type filter hook forward priority 0; 
		policy drop;
		
		# Forward Docker
		ip saddr 172.17.0.0/12 accept
       	ip daddr 172.17.0.0/12 accept
	}

	chain output {
		type filter hook output priority 0; 
		policy accept;
	}
}
