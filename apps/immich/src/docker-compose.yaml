networks:
  immich:
    name: immich
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${IMMICH_DOCKER_SUBNET:?err}.0/24
          gateway: ${IMMICH_DOCKER_SUBNET:?err}.1
services:
  # Immich - Cloud for photos
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: always
    networks:
      immich:
        ipv4_address: ${IMMICH_DOCKER_SUBNET:?err}.10
    depends_on:
      - redis
      - postgres
    # extends:
    #   file: hwaccel.transcoding.yml
    #   service: cpu # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding
    ports:
      - ${PORT_UI_IMMICH}:2283
    volumes:
      - ${DATA_FOLDER}/immich:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
  # Immich Machine learning - Immich machine learning server
  immich-machine-learning:
    # For hardware acceleration, add one of -[armnn, cuda, openvino] to the image tag.
    # Example tag: release-cuda
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich-machine-learning
    restart: always
    networks:
      immich:
        ipv4_address: ${IMMICH_DOCKER_SUBNET:?err}.20
    # extends: # uncomment this section for hardware acceleration - see https://immich.app/docs/features/ml-hardware-acceleration
    #   file: hwaccel.ml.yml
    #   service: cpu # set to one of [armnn, cuda, openvino, openvino-wsl] for accelerated inference - use the `-wsl` version for WSL2 where applicable
    volumes:
      - model-cache:/cache
  # Redis - Immich redis server
  redis:
    image: docker.io/redis:6.2-alpine@sha256:148bb5411c184abd288d9aaed139c98123eeb8824c5d3fce03cf721db58066d8
    container_name: redis
    restart: always
    networks:
      immich:
        ipv4_address: ${IMMICH_DOCKER_SUBNET:?err}.31
    healthcheck:
      test: redis-cli ping || exit 1
  # Postgres - Immich postgres server
  postgres:
    image: docker.io/tensorchord/pgvecto-rs:pg14-v0.2.0@sha256:739cdd626151ff1f796dc95a6591b55a714f341c737e27f045019ceabf8e8c52
    container_name: postgres
    restart: always
    networks:
      immich:
        ipv4_address: ${IMMICH_DOCKER_SUBNET:?err}.32
    healthcheck:
      test: pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" || exit 1; Chksum="$$(psql --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    command: >-
      postgres
      -c shared_preload_libraries=vectors.so
      -c 'search_path="$$user", public, vectors'
      -c logging_collector=on
      -c max_wal_size=2GB
      -c shared_buffers=512MB
      -c wal_compression=on
    volumes:
      - ${APPS_FOLDER}/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: immich
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums

  # Portainer Agent - for remote portainer management
  portainer-agent:
    image: portainer/agent:2.35.0-alpine
    container_name: portainer-agent
    restart: unless-stopped
    networks:
      immich:
        ipv4_address: ${IMMICH_DOCKER_SUBNET:?err}.09
    ports:
      - "19001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      - AGENT_CLUSTER_ADDR=tasks.portainer-agent
      - CAP_HOST_MANAGEMENT=1
