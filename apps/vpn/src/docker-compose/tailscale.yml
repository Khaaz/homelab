services:
  tailscale:
    image: tailscale/tailscale:v1.90
    container_name: tailscale
    restart: unless-stopped
    networks:
      vpn:
        ipv4_address: ${VPN_DOCKER_SUBNET:?err}.10
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    volumes:
      - ${APPS_FOLDER:?err}/tailscale/state:/var/lib/tailscale
    environment:
      - TS_AUTHKEY=tskey-client-notAReal-OAuthClientSecret1Atawk
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
