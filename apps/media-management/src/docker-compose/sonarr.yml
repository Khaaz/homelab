services:
  # Sonarr - Serie library
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.15
    container_name: sonarr
    restart: unless-stopped
    networks:
      media-management:
        ipv4_address: ${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}.24
    user: ${PUID:?err}:${PGID:?err}
    depends_on:
      prowlarr:
        condition: service_started
        restart: false
      qbittorrent:
        condition: service_started
        restart: false
    ports:
      - ${PORT_UI_SONARR:?err}:8989
    dns:
      - 1.1.1.1
    volumes:
      - ${APPS_FOLDER:?err}/sonarr:/config # config
      - ${DATA_FOLDER:?err}:/data # data
      - ${APPS_FOLDER:?err}/sonarr/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:sonarr
      - TP_THEME=${TP_THEME:?err}
    post_start:
      - command: /scripts/parse_file.sh /_setup/templates/config.xml /config/config.xml
        user: root
        environment:
          - PUID=${PUID:?err}
          - PGID=${PGID:?err}
          # setup
          - API_KEY_SONARR=${API_KEY_SONARR:?err}
      - command: /scripts/execute_sql.sh /config/sonarr.db
        user: root
        environment:
          # setup
          - DOCKER_SUBNET=${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}
          - API_KEY_PROWLARR=${API_KEY_PROWLARR:?err}
          - PORT_UI_PROWLARR=${PORT_UI_PROWLARR:?err}
          - PORT_UI_QBITTORRENT=${PORT_UI_QBITTORRENT:?err}
