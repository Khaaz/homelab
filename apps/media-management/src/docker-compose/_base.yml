networks:
  media-management:
    name: media-management
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}.0/24
          gateway: ${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}.1
  media-management-vpn:
    name: media-management-vpn
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${MEDIA_MANAGEMENT_DOCKER_SUBNET_VPN:?err}.0/24
          gateway: ${MEDIA_MANAGEMENT_DOCKER_SUBNET_VPN:?err}.1
services:
  # Portainer Agent - for remote portainer management
  portainer-agent:
    image: portainer/agent:2.35.0-alpine
    container_name: mm-portainer-agent
    restart: unless-stopped
    networks:
      media-management:
        ipv4_address: ${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}.9
    ports:
      - "${PORTAINER_AGENT_PORT:-19001}:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    environment:
      - AGENT_CLUSTER_ADDR=tasks.portainer-agent
      - CAP_HOST_MANAGEMENT=1
      
