# Homarr - Application Dashboard
  homarr:
    image: ghcr.io/ajnart/homarr:latest
    container_name: homarr
    restart: unless-stopped
    networks:
      media-management:
        ipv4_address: "${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}.31"
    ports:
      - "${PORT_UI_HOMARR:?err}:7575"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPS_FOLDER:?err}/homarr/configs:/app/data/configs # config
      - ${APPS_FOLDER:?err}/homarr/data:/data # data
      - ${APPS_FOLDER:?err}/homarr/_setup:/_setup # setup
      - ${APPS_FOLDER:?err}/homarr/icons:/app/public/icons
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
    # post_start:
    #   - command: /scripts/parse-file.sh /_setup/templates/default.json /app/data/configs/default.json
    #     user: root

# Maintainerr - Management Dashboard
  maintainerr:
    image: ghcr.io/jorenn92/maintainerr:latest
    container_name: maintainerr
    restart: unless-stopped
    networks:
      media-management:
        ipv4_address: "${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}.32"
    user:  ${PUID:?err}:${PGID:?err}
    ports:
      - "${PORT_UI_MAINTAINERR:?err}:6246"
    volumes:
      - ${APPS_FOLDER:?err}/maintainerr/config:/opt/data #config
      - ${APPS_FOLDER:?err}/prowlarr/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - TZ=${TIMEZONE:?err}
      # - DEBUG=true # uncomment (remove the hashtag) to enable debug logs
    post_start:
      - command: /scripts/execute-sql.sh /opt/data/config/maintainerr.sqlite
        user: root

