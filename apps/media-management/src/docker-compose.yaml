###########################################################################
###########################################################################
## CORE
###########################################################################
###########################################################################

# Gluetun - VPN Client
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: always
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8888:8888/tcp"                         # Gluetun Local Network HTTP proxy
      - "8388:8388/tcp"                         # Gluetun Local Network Shadowsocks
      - "8388:8388/udp"                         # Gluetun Local Network Shadowsocks
      - ${PORT_SERVICE_GLUETUN:?err}:${PORT_SERVICE_GLUETUN:?err} # Gluetun Status Port

      - "${PORT_UI_PROWLARR:?err}:9696"      # WebUI Portal: Prowlarr
      - "${PORT_SERVICE_FLARESOLVERR:?err}:8191"        # Service Port: FlareSolverr
      - "${PORT_UI_QBITTORRENT:?err}:${PORT_UI_QBITTORRENT:?err}"   # WebUI Portal: qBittorrent
      - "${PORT_SERVICE_QBITTORRENT:?err}:6881"                # Transmission Torrent Port
      # - "${WEBUI_PORT_UI_SABNZBD:?err}:8080"       # WebUI Portal: SABnzbd
    volumes:
      - ${APPS_FOLDER:?err}/gluetun:/gluetun # config
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:?err}
      - OPENVPN_USER=${VPN_USERNAME:?err}
      - OPENVPN_PASSWORD=${VPN_PASSWORD:?err}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_REGIONS=${SERVER_REGIONS}
      - SERVER_CITIES=${SERVER_CITIES}
      - SERVER_HOSTNAMES=${SERVER_HOSTNAMES}
      - SERVER_CATEGORIES=${SERVER_CATEGORIES}
      - FIREWALL_OUTBOUND_SUBNETS=${LOCAL_SUBNET:?err}
      - HTTP_CONTROL_SERVER_ADDRESS=:${PORT_SERVICE_GLUETUN:?err}
      - VPN_TYPE=${VPN_TYPE}
      - OPENVPN_ENDPOINT_IP=${OPENVPN_ENDPOINT_IP}
      - OPENVPN_ENDPOINT_PORT=${OPENVPN_ENDPOINT_PORT}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_PRESHARED_KEY=${WIREGUARD_PRESHARED_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES}
      - HTTPPROXY=on
      - SHADOWSOCKS=on
    networks:
        media-management-vpn:
        media-management:
          ipv4_address: "${MEDIA_MANAGEMENT_DOCKER_SUBNET:?err}.10"

###########################################################################
###########################################################################
## CORE - ARR [download]
###########################################################################
###########################################################################

# Prowlarr - Indexer and Search Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:develop
    container_name: prowlarr
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    volumes:
      - ${APPS_FOLDER:?err}/prowlarr:/config # config
      - ${APPS_FOLDER:?err}/prowlarr/_setup:/_setup # setup
      - ${SCRIPTS_FOLDER:?err}:/scripts # scripts
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:prowlarr
      - TP_THEME=${TP_THEME:?err}
      # setup env vars
      - API_KEY_PROWLARR=${API_KEY_PROWLARR:?err}
    post_start:
      - command: /scripts/parse-file.sh /_setup/templates/config.xml /config/config.xml
        user: root
      - command: /scripts/execute-sql.sh /config/prowlarr.db
        user: root

# Flaresolverr - Cloudflare Proxy Server 
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TIMEZONE:?err}

# Qbittorrent - Torrent client
# default user/password: admin/admin!
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    volumes:
      - ${APPS_FOLDER:?err}/qbittorrent:/config # config
      - ${DATA_FOLDER:?err}/torrents:/data # data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - WEBUI_PORT=${PORT_UI_QBITTORRENT:?err}

