[local]
localhost ansible_connection=local

[homelab]
vm-local ansible_host=192.168.1.200 ansible_user=automation ansible_ssh_private_key_file=../../config/ssh/proxmox/automation_key.dev
proxmox-node1 ansible_host=192.168.1.200 ansible_user=automation ansible_ssh_private_key_file=../../config/ssh/proxmox/automation_key

[vm]
vm-generic ansible_host=192.168.1.200 ansible_port=2222 ansible_user=automation ansible_ssh_private_key_file=../../config/ssh/jump/automation_key

[jump]
vm-jump ansible_host=192.168.1.200 ansible_port=2222 ansible_user=automation ansible_ssh_private_key_file=../../config/ssh/jump/automation_key
