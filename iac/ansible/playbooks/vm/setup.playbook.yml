---
- name: Deploy app via git + compose
  hosts: all
  become: true
  vars:
    git_repo_url: "https://khaaz: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@github.com/Khaaz/homelab.git"

    clone_dir: "/tmp/app-deploy-{{ app_name }}"
    work_dir: "/home/app/homelab"
    controller_repo_root: "{{ playbook_dir) }}/../../../.."

    admin_user: "admin" # Owner for copied files

    # App name from controller env var APP_NAME
    app_name: "{{ lookup('env', 'APP_NAME') | default('', true) }}"
    
    # Options (can be overridden by environment variables)
    # opt - refresh config: 
    # - level 1 "none": do nothing 
    # - level 2 "generated": Copy paste the .env.generated file
    # - level 3 "full": also copy .env and networking.env that exist in the controller root (always copy and override if one already exist)
    refresh_config: "{{ lookup('env','REFRESH_CONFIG') | default('generated', true) }}" # none|generated|full

  tasks:
    # Init workdir
    - name: Ensure destination root exists
      ansible.builtin.file:
        path: "{{ work_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    - name: Ensure subdirectories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop:
        - "{{ work_dir }}/src"
        - "{{ work_dir }}/apps"

    ## Clone the repo
    - name: Clone/Update repo into tmp on target
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ clone_dir }}"
        version: "HEAD"
        force: false
        update: true
        depth: 1
      environment:
        GIT_LFS_SKIP_SMUDGE: "1"

    ## Copy the work files
    # Copy app dir
    - name: Copy src/app-bootstrap -> target/src/app-bootstrap
      ansible.builtin.copy:
        src: "{{ clone_dir }}/src/app-bootstrap/"
        dest: "{{ work_dir }}/src/app-bootstrap/"
        remote_src: true
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    - name: Copy apps/<app_name> -> target/apps/<app_name>
      ansible.builtin.copy:
        src: "{{ clone_dir }}/apps/{{ app_name }}/"
        dest: "{{ work_dir }}/apps/{{ app_name }}/"
        remote_src: true
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    # Copy infra folders
    - name: Get all apps from apps/
      include_role:
        name: list-subfolders
      vars:
        input_folder: "{{ clone_dir }}/apps"
        output_var: "apps_list"

    - name: Create infra directories for each app in target
      ansible.builtin.file:
        path: "{{ work_dir }}/apps/{{ item | basename }}/infra"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ apps_list }}"

    - name: Copy each apps/**/infra/proxmox.yml -> target/apps/**/infra/proxmox.yml
      ansible.builtin.copy:
        src: "{{ item }}/infra/proxmox.yml"
        dest: "{{ work_dir }}/apps/{{ item | basename }}/infra/proxmox.yml"
        remote_src: true
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ apps_list }}"

    # Copy env files from the controller repo
    # From:   {{ inventory_dir }}/../apps/<app_name>/config/
    # Files:  networking.env, .env.generated, .env
    - name: Set list of env files to copy
      set_fact:
        env_files: "{{ ['networking.env', '.env.generated', '.env'] if refresh_config == 'full'
                       else (['.env.generated'] if refresh_config == 'generated' else []) }}"

    - name: Verify controller apps/<app_name>/config files exists
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/apps/{{ app_name }}/config/{{ item }}"
      loop: "{{ env_files }}"
      register: controller_env_files
      delegate_to: localhost
      run_once: true
      when: env_files | length > 0

    - name: Copy controller apps/<app_name>/config files -> target/apps/<app_name>/config
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/apps/{{ app_name }}/config/{{ item.item }}"
        dest: "{{ work_dir }}/apps/{{ app_name }}/config/{{ item.item }}"
        mode: "{{ '0600' if item.item in ['.env', '.env.generated'] else '0644' }}"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ controller_env_files.results }}"
      when: item.stat.exists
      delegate_to: localhost
      run_once: true

    # Find all networking.env.default and networking.env files in controller apps/**/config
    - name: Find networking env files in controller repo
      ansible.builtin.find:
        paths: "{{ controller_repo_root }}/apps"
        patterns:
          - 'networking.env'
          - 'networking.env.default'
        file_type: file
        recurse: yes
      register: found_networking_envs
      delegate_to: localhost
      run_once: true

    - name: Copy controller apps/**/config/networking.env -> target/apps/**/config/networking.env
      ansible.builtin.copy:
        src: "{{ item }}"
        # Replace controller_repo_root prefix with the work_dir prefix so file lands in the same apps/.../config/... location
        dest: "{{ item | regex_replace('^' + (controller_repo_root | regex_escape) + '/', work_dir + '/') }}"
        mode: "{{ '0644' }}"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ found_networking_envs.files | map(attribute='path') | list }}"
      when: found_networking_envs.matched > 0
      delegate_to: localhost
      run_once: true

    # ---- Compose via apps/<app_name>/compose.sh ----
    - name: Ensure compose.sh is executable
      ansible.builtin.file:
        path: "{{ work_dir }}/apps/{{ app_name }}/compose.sh"
        mode: "0755"
        state: file
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
    - name: Compose down via compose.sh (idempotent reset)
      ansible.builtin.command:
        cmd: "./compose.sh --proxmox down --remove-orphans"
        chdir: "{{ work_dir }}/apps/{{ app_name }}"
      register: compose_down
      changed_when: "'Stopping' in compose_down.stdout or 'Removing' in compose_down.stdout or compose_down.rc == 0"

    - name: Compose up via compose.sh (recreate/pull/build)
      ansible.builtin.command:
        cmd: "./compose.sh --proxmox up -d --pull always --build --renew-anon-volumes"
        chdir: "{{ work_dir }}/apps/{{ app_name }}"
      register: compose_up
      changed_when: >
        'Creating' in compose_up.stdout or
        'Recreating' in compose_up.stdout or
        'Pulling' in compose_up.stdout or
        'Building' in compose_up.stdout or
        compose_up.rc == 0

  post_tasks:
    - name: Cleanup temporary clone directory
      ansible.builtin.file:
        path: "{{ clone_dir }}"
        state: absent
