---
- name: Deploy app via git + compose
  hosts: all
  become: true
  vars:
    git_repo_url: "https://khaaz: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@github.com/Khaaz/homelab.git"

    clone_dir: "/tmp/app-deploy-{{ app_name }}"
    work_dir: "/home/app/homelab"
    controller_repo_root: "{{ playbook_dir }}/../../../.."

    admin_user: "admin" # Owner for copied files

    # App name from controller env var APP_NAME
    app_name: "{{ lookup('env', 'APP_NAME') | default('', true) }}"
    
    # Options (can be overridden by environment variables)
    # opt - refresh config: 
    # - level 1 "none": do nothing 
    # - level 2 "generated": Copy paste the .env.generated file
    # - level 3 "full": also copy .env and networking.env that exist in the controller root (always copy and override if one already exist)
    refresh_config: "{{ lookup('env','REFRESH_CONFIG') | default('full', true) }}" # none|generated|full

  tasks:
    # Init workdir
    - name: Ensure destination root exists
      ansible.builtin.file:
        path: "{{ work_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    - name: Ensure subdirectories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop:
        - "{{ work_dir }}/src"
        - "{{ work_dir }}/apps"
        - "{{ work_dir }}/apps/{{ app_name }}"

    ## Clone the repo
    - name: Clone/Update repo into tmp on target
      ansible.builtin.git:
        repo: "{{ git_repo_url }}"
        dest: "{{ clone_dir }}"
        version: "HEAD"
        force: false
        update: true
        depth: 1
      environment:
        GIT_LFS_SKIP_SMUDGE: "1"

    ## Copy the work files
    # Copy app dir
    - name: Copy src/app-bootstrap -> target/src/app-bootstrap
      ansible.builtin.copy:
        src: "{{ clone_dir }}/src/app-bootstrap/"
        dest: "{{ work_dir }}/src/app-bootstrap/"
        remote_src: true
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"

    - name: Copy apps/<app_name> -> target/apps/<app_name>
      ansible.builtin.copy:
        src: "{{ clone_dir }}/apps/{{ app_name }}/"
        dest: "{{ work_dir }}/apps/{{ app_name }}/"
        remote_src: true
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
    
    - name: Adjust permissions
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop:
        - "{{ work_dir }}/src/app-bootstrap"
        - "{{ work_dir }}/apps/{{ app_name }}"

    # Init infra and config directories
    - name: Get all apps from apps/
      include_role:
        name: list-subfolders
      vars:
        input_folder: "{{ clone_dir }}/apps"
        output_var: "apps_list"

    - name: Create infra directories for each app in target
      ansible.builtin.file:
        path: "{{ work_dir }}/apps/{{ item | basename }}/infra"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ apps_list }}"

    - name: Create config directories for each app in target
      ansible.builtin.file:
        path: "{{ work_dir }}/apps/{{ item | basename }}/config"
        state: directory
        mode: "0755"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ apps_list }}"

    # Copy each apps/**/infra/proxmox.yml -> target/apps/**/infra/proxmox.yml
    - name: Copy each apps/**/infra/proxmox.yml -> target/apps/**/infra/proxmox.yml
      ansible.builtin.copy:
        src: "{{ item }}/infra/proxmox.yml"
        dest: "{{ work_dir }}/apps/{{ item | basename }}/infra/proxmox.yml"
        remote_src: true
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ apps_list }}"
    
    # Copy each apps/**/config/networking.env.default -> target/apps/**/config/networking.env.default
    - name: Copy each apps/**/config/networking.env.default -> target/apps/**/config/networking.env.default
      ansible.builtin.copy:
        src: "{{ item }}/config/networking.env.default"
        dest: "{{ work_dir }}/apps/{{ item | basename }}/config/networking.env.default"
        remote_src: true
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ apps_list }}"
      failed_when: false
    
    # Copy each apps/**/config/networking.env -> target/apps/**/config/networking.env if exists
    - name: Copy each apps/**/config/networking.env -> target/apps/**/config/networking.env
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/apps/{{ item | basename }}/config/networking.env"
        dest: "{{ work_dir }}/apps/{{ item | basename }}/config/networking.env"
        mode: "0644"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      loop: "{{ apps_list }}"
      when:
        - refresh_config == 'full'
      failed_when: false

    # Copy env files from the controller repo
    # From:   {{ inventory_dir }}/../apps/<app_name>/config/
    # Files:  networking.env, .env.generated, .env
    - name: Copy controller apps/<app_name>/config/.env.generated files -> target/apps/<app_name>/config/.env.generated
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/apps/{{ app_name }}/config/.env.generated"
        dest: "{{ work_dir }}/apps/{{ app_name }}/config/.env.generated"
        mode: "0600"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      when:
        - refresh_config in ['generated','full']
      failed_when: false

    - name: Copy controller apps/<app_name>/config/.env files -> target/apps/<app_name>/config/.env
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/apps/{{ app_name }}/config/.env"
        dest: "{{ work_dir }}/apps/{{ app_name }}/config/.env"
        mode: "0600"
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
      when:
        - refresh_config in ['full']
      failed_when: false

    ## Stop / Start / restart the app
    - name: Ensure compose.sh is executable
      ansible.builtin.file:
        path: "{{ work_dir }}/apps/{{ app_name }}/compose.sh"
        mode: "0755"
        state: file
        owner: "{{ admin_user }}"
        group: "{{ admin_user }}"
    - name: Compose down via compose.sh (idempotent reset)
      ansible.builtin.command:
        cmd: "./compose.sh --proxmox down --remove-orphans"
        chdir: "{{ work_dir }}/apps/{{ app_name }}"
      register: compose_down
      changed_when: "'Stopping' in compose_down.stdout or 'Removing' in compose_down.stdout or compose_down.rc == 0"

    - blocks:
        - name: Compose up via compose.sh (recreate/pull/build)
          ansible.builtin.command:
            cmd: "./compose.sh --proxmox up -d --wait"
            chdir: "{{ work_dir }}/apps/{{ app_name }}"
          register: compose_up
          retries: 5
          delay: 10
          until: compose_up.rc == 0
          changed_when: >
            'Creating' in compose_up.stdout or
            'Recreating' in compose_up.stdout or
            'Pulling' in compose_up.stdout or
            'Building' in compose_up.stdout or
            compose_up.rc == 0
      rescue:
        - name: Retry 5 times down/up sequence (first launch)
          ansible.builtin.shell: |
            set -o pipefail
            ./compose.sh --proxmox down --remove-orphans || true
            ./compose.sh --proxmox up -d --wait
          args:
            chdir: "{{ work_dir }}/apps/{{ app_name }}"
          register: compose_try
          retries: 5
          delay: 10
          until: compose_try.rc == 0
          changed_when: >
            'Creating' in compose_try.stdout or
            'Recreating' in compose_try.stdout or
            'Pulling' in compose_try.stdout or
            'Building' in compose_try.stdout or
            compose_try.rc == 0

    ## On first initialization, restart the app via compose down/up again
    - name: Check if /root/.init exists
      ansible.builtin.stat:
        path: "/root/.init"
      register: init_file

    - name: First initialization - Restart app (compose down)
      ansible.builtin.command:
        cmd: "./compose.sh --proxmox down --remove-orphans"
        chdir: "{{ work_dir }}/apps/{{ app_name }}"
      register: init_compose_down
      when: not init_file.stat.exists
      changed_when: "'Stopping' in init_compose_down.stdout or 'Removing' in init_compose_down.stdout or init_compose_down.rc == 0"

    - name: First initialization - Restart app (compose up)
      ansible.builtin.command:
        cmd: "./compose.sh --proxmox up -d --wait"
        chdir: "{{ work_dir }}/apps/{{ app_name }}"
      register: init_compose_up
      when: not init_file.stat.exists
      retries: 5
      delay: 10
      until: init_compose_up.rc == 0
      changed_when: >
        'Creating' in init_compose_up.stdout or
        'Recreating' in init_compose_up.stdout or
        'Pulling' in init_compose_up.stdout or
        'Building' in init_compose_up.stdout or
        init_compose_up.rc == 0

    - name: Create /root/.init marker file
      ansible.builtin.file:
        path: "/root/.init"
        state: touch
        mode: "0600"
        owner: "root"
        group: "root"
      when: not init_file.stat.exists
  post_tasks:
    - name: Cleanup temporary clone directory
      ansible.builtin.file:
        path: "{{ clone_dir }}"
        state: absent
