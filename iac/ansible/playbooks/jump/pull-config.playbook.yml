---
- name: Pull config files from Jump VM to controller
  hosts: jump
  become: true
  vars:
    work_dir: "/home/admin/homelab"
    controller_repo_root: "{{ inventory_dir }}/../.."
    # opt - pull copy mode:
    # - option 1 "safe": copy only when the file does not exist locally
    # - option 2 "reset": always overwrite local files
    pull_config_mode: "{{ lookup('env','pull_config_mode') | default('safe', true) }}" # safe|reset

  tasks:
    # users-config.toml
    - name: Check if controller config/users-config.toml exists
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/config/users-config.toml"
      delegate_to: localhost
      run_once: true
      register: st_local_users_config

    - name: Backup controller users-config.toml -> users-config.toml.old
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/config/users-config.toml"
        dest: "{{ controller_repo_root }}/config/users-config.toml.old"
        remote_src: true
        mode: "0644"
        force: true
      delegate_to: localhost
      run_once: true
      when:
        - pull_config_mode == 'reset'
        - st_local_users_config.stat.exists

    - name: Pull users-config.toml
      ansible.builtin.fetch:
        src: "{{ work_dir }}/config/users-config.toml"
        dest: "{{ controller_repo_root }}/config/"
        flat: true
      when:
        - pull_config_mode == 'reset' or not st_local_users_config.stat.exists

    # global-config.toml
    - name: Check if controller config/global-config.toml exists
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/config/global-config.toml"
      delegate_to: localhost
      run_once: true
      register: st_local_global_config

    - name: Backup controller global-config.toml -> global-config.toml.old
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/config/global-config.toml"
        dest: "{{ controller_repo_root }}/config/global-config.toml.old"
        remote_src: true
        mode: "0644"
        force: true
      delegate_to: localhost
      run_once: true
      when:
        - pull_config_mode == 'reset'
        - st_local_global_config.stat.exists

    - name: Pull global-config.toml
      ansible.builtin.fetch:
        src: "{{ work_dir }}/config/global-config.toml"
        dest: "{{ controller_repo_root }}/config/"
        flat: true
      when:
        - pull_config_mode == 'reset' or not st_local_global_config.stat.exists

    # global-config.generated.toml
    - name: Check if controller config/global-config.generated.toml exists
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/config/global-config.generated.toml"
      delegate_to: localhost
      run_once: true
      register: st_local_global_generated

    - name: Backup controller global-config.generated.toml -> global-config.generated.toml.old
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/config/global-config.generated.toml"
        dest: "{{ controller_repo_root }}/config/global-config.generated.toml.old"
        remote_src: true
        mode: "0644"
        force: true
      delegate_to: localhost
      run_once: true
      when:
        - pull_config_mode == 'reset'
        - st_local_global_generated.stat.exists

    - name: Pull global-config.generated.toml
      ansible.builtin.fetch:
        src: "{{ work_dir }}/config/global-config.generated.toml"
        dest: "{{ controller_repo_root }}/config/"
        flat: true
      when:
        - pull_config_mode == 'reset' or not st_local_global_generated.stat.exists

    # ssh directory
    - name: Pull ssh directory (reset / overwrite)
      ansible.posix.synchronize:
        src: "{{ work_dir }}/config/ssh/"
        dest: "{{ controller_repo_root }}/config/ssh/"
        mode: pull
      when: pull_config_mode == 'reset'

    - name: List remote ssh subdirectories
      ansible.builtin.command:
        cmd: "find {{ work_dir }}/config/ssh -mindepth 1 -maxdepth 1 -type d -printf '%f\n'"
      register: remote_ssh_dirs_cmd
      changed_when: false
      when: pull_config_mode == 'safe'

    - name: Set remote ssh subdirectories fact
      ansible.builtin.set_fact:
        remote_ssh_subdirs: "{{ remote_ssh_dirs_cmd.stdout_lines | reject('equalto', '') | list }}"
      when: pull_config_mode == 'safe'

    - name: Check local ssh subdirectories
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/config/ssh/{{ item }}"
      delegate_to: localhost
      loop: "{{ remote_ssh_subdirs | default([]) }}"
      register: local_ssh_subdir_stats
      when:
        - pull_config_mode == 'safe'
        - remote_ssh_subdirs | default([]) | length > 0

    - name: Pull missing ssh subdirectories (safe)
      ansible.posix.synchronize:
        src: "{{ work_dir }}/config/ssh/{{ item.item }}/"
        dest: "{{ controller_repo_root }}/config/ssh/{{ item.item }}/"
        mode: pull
      loop: "{{ local_ssh_subdir_stats.results | default([]) }}"
      when:
        - pull_config_mode == 'safe'
        - not item.stat.exists
