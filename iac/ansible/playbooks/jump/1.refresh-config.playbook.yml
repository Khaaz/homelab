---
- name: Setup the Jump VM - Refresh config based on the refresh config level
  hosts: jump
  become: true
  vars:
    # Jump VM target repo
    work_dir: "/home/admin/homelab"
    # Controller (Ansible runner) repo root
    controller_repo_root: "{{ inventory_dir }}/../.."

    # Options (can be overridden by environment variables)
    # opt - refresh config: 
    # - level 1 "none": do nothing 
    # - level 2 "config": copy paste the global-config.toml (default) + run the environment/generate_env.sh --auto script 
    # - level 3 "full": also copy .env and networking.env that exist in the controller root (always copy and override if one already exist)
    refresh_config: "{{ lookup('env','REFRESH_CONFIG') | default('config', true) }}" # none|config|full

  tasks:
    - name: Running refresh_config with value
      ansible.builtin.debug:
        var: refresh_config
      run_once: true
    
    ## Global config
    # => refresh_config: config/full <=
    # Copy the global-config.toml
    - name: Check if controller config/global-config.toml exists
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/config/global-config.toml"
      delegate_to: localhost
      run_once: true
      register: st_controller_global_toml
    
    - name: Copy controller config/global-config.toml -> target/config/global-config.toml
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/config/global-config.toml"
        dest: "{{ work_dir }}/config/global-config.toml"
        owner: admin
        group: admin
        mode: "0644"
        force: yes
      when:
        - refresh_config in ['config','full']
        - st_controller_global_toml.stat.exists

    # => refresh_config: config/full <=
    # Copy the global-config.generated.toml
    - name: Check if controller config/global-config.generated.toml exists
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/config/global-config.generated.toml"
      delegate_to: localhost
      run_once: true
      register: st_controller_global_generated_toml
    
    - name: Copy controller config/global-config.generated.toml -> target/config/global-config.generated.toml
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/config/global-config.generated.toml"
        dest: "{{ work_dir }}/config/global-config.generated.toml"
        owner: admin
        group: admin
        mode: "0644"
        force: yes
      when: 
        - refresh_config in ['config','full']
        - st_controller_global_generated_toml.stat.exists
    
    # => refresh_config: config/full <=
    # Copy the users-config.toml
    - name: Check if controller config/users-config.toml exists
      ansible.builtin.stat:
        path: "{{ controller_repo_root }}/config/users-config.toml"
      delegate_to: localhost
      run_once: true
      register: st_controller_users_toml
    
    - name: Copy controller config/users-config.toml -> target/config/users-config.toml
      ansible.builtin.copy:
        src: "{{ controller_repo_root }}/config/users-config.toml"
        dest: "{{ work_dir }}/config/users-config.toml"
        owner: admin
        group: admin
        mode: "0644"
        force: yes
      when: 
        - refresh_config in ['config','full']
        - st_controller_users_toml.stat.exists

    # Generate .env.generated (generate_env script)
    - name: Check for generate_env.sh script in target
      ansible.builtin.stat:
        path: "{{ work_dir }}/environment/generate_env.sh"
      register: st_generate_env_sh
    - name: Run environment/generate_env.sh --auto
      ansible.builtin.command:
        cmd: "./generate_env.sh --auto"
        chdir: "{{ work_dir }}/environment"
      when:
        - refresh_config in ['config','full']
        - st_generate_env_sh.stat.exists
      register: generate_env_run
      changed_when: generate_env_run.rc == 0

    # => refresh_config: full <=
    # Copy apps/**/config/.env, apps/**/config/proxmox.env and apps/**/config/networking.env
    - name: Find .env, proxmox.env and networking.env files under controller apps/**/config
      ansible.builtin.find:
        paths: "{{ controller_repo_root }}/apps/"
        recurse: yes
        file_type: file
        hidden: yes
        patterns:
          - '.env'
          - 'networking.env'
          - 'proxmox.env'
      delegate_to: localhost
      run_once: true
      register: found_app_env_files
      when: refresh_config == 'full'

    - name: "Debug: show found env files"
      ansible.builtin.debug:
        msg: "{{ found_app_env_files.files | map(attribute='path') | list }}"
      run_once: true
      when: refresh_config == 'full'

    - name: Ensure destination config directories
      ansible.builtin.file:
        path:  >-
          {{
            (item | dirname)
            | regex_replace('^.*/apps/', work_dir + '/apps/')
          }}
        state: directory
        mode: "0755"
        owner: admin
        group: admin
      loop: "{{ found_app_env_files.files | map(attribute='path') | list }}"
      when:
        - refresh_config == 'full'
        - found_app_env_files.matched is defined and found_app_env_files.matched > 0

    - name: Copy files from controller apps/**/config -> target/apps/**/config
      ansible.builtin.copy:
        src: "{{ item }}"
        dest:  >-
          {{
            item | regex_replace('^.*/apps/', work_dir + '/apps/')
          }}
        owner: admin
        group: admin
        mode: "{{ '0600' if (item | basename) == '.env' else '0644' }}"
        force: true
      loop: "{{ found_app_env_files.files | map(attribute='path') | list }}"
      when:
        - refresh_config == 'full'
        - found_app_env_files.matched is defined and found_app_env_files.matched > 0
  
  post_tasks:
    - name: Assign entire homelab directory to admin user
      ansible.builtin.file:
        path: "{{ work_dir }}"
        owner: admin
        group: admin
        recurse: yes
