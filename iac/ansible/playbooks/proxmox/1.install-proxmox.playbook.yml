---
- name: Configure Proxmox and System Settings
  hosts: homelab
  become: true
  tasks:
    # Phase 1 - Setup
    - name: Add Proxmox VE no-subscription repository (deb822)
      ansible.builtin.deb822_repository:
        name: proxmox-no-sub
        types: [deb]
        uris: http://download.proxmox.com/debian/pve
        suites: [bookworm]
        components: [pve-no-subscription]
        architectures: [amd64]
        signed_by: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
        state: present
    - name: Download Proxmox GPG key
      ansible.builtin.get_url:
        url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
        dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
        mode: "0644"
    - name: Update APT cache and perform full upgrade
      ansible.builtin.apt:
        update_cache: yes
        upgrade: full

    # Phase 2 - Install kernel and reboot 
    - name: Install Proxmox VE kernel
      ansible.builtin.apt:
        name: proxmox-default-kernel
        state: present
    - name: Restart system after kernel install
      import_role:
        name: restart

    # Phase 3 - Install
    - name: Preseed Postfix selections for Proxmox VE installation
      ansible.builtin.debconf:
        name: postfix
        question: postfix/main_mailer_type
        value: Local only
        vtype: select
    - name: Install required base packages (proxmox-ve...) for Proxmox
      ansible.builtin.apt:
        name:
          - proxmox-ve
          - postfix
          - open-iscsi
          - chrony
        state: present
    - name: Remove os-prober package
      ansible.builtin.apt:
        name: os-prober
        state: absent
        purge: yes

    # Phase 4 - Override kernel and cleanup
    - name: Check if a Proxmox kernel is installed
      ansible.builtin.find:
        paths: /boot
        patterns: 'vmlinuz-*-pve'
        file_type: file
      register: proxmox_kernel_find
    - name: Remove default Debian kernel packages
      ansible.builtin.apt:
        name:
          - linux-image-amd64
          - "linux-image-6.1*"
        state: absent
        purge: yes
      when: proxmox_kernel_find.matched | int > 0
    - name: Update GRUB bootloader
      ansible.builtin.command: update-grub
      changed_when: true
    - name: Restart system after grub update
      import_role:
        name: restart
