---
# Wait for the proxmox server to be reachable
- import_playbook: ../common/wait-for-connection.playbook.yml
  vars:
    target_group: homelab
# Install proxmox on raw debian
- import_playbook: ./1.install-proxmox.playbook.yml
# Setup networking and filtering
- import_playbook: ./2.setup-networking.playbook.yml
# Hardening debian/proxmox users
- import_playbook: ./3.hardening.playbook.yml
# Resource mapping (for passthrough)
- import_playbook: ./4.prepare-resource-mapping.playbook.yml
# Additional configuration and setup
- import_playbook: ./5.additional-setup.playbook.yml
# User management
- import_playbook: ./6.setup-user.playbook.yml
