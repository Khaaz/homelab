---
- name: List all subdirectories in input folder
  ansible.builtin.find:
    paths: "{{ input_folder }}"
    file_type: directory
    depth: 1
  register: found_dirs

- name: Set role output variable dynamically
  set_fact:
    "{{ output_var_name }}": "{{ found_dirs.files | map(attribute='path') | list }}"

- name: Debug - Show subfolder list
  ansible.builtin.debug:
    var: "{{ output_var_name }}"
