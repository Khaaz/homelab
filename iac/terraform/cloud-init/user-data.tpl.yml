#cloud-config
hostname: ${hostname}
manage_etc_hosts: true
ssh_pwauth: false

users:
  - name: admin
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/sh
    lock_passwd: false
    # random password generated by terraform. There is no reason to use it as this user will only be used via ssh key
    plain_text_passwd: "${pwd_admin}"
    ssh_authorized_keys:
      - ${admin_pubkey}

  - name: automation
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/sh
    lock_passwd: false
    # random password generated by terraform. There is no reason to use it as this user will only be used via ssh key
    plain_text_passwd: "${pwd_automation}"
    ssh_authorized_keys:
      - ${automation_pubkey}
  
  - name: app
    shell: /bin/sh
    lock_passwd: true
