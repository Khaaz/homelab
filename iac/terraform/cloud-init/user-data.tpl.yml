hostname: ${hostname}
manage_etc_hosts: true
ssh_pwauth: false

users:
  - name: admin
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/sh
    lock_passwd: true
    ssh_authorized_keys:
      - ${admin_pubkey}

  - name: ansible
    groups: [wheel]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/sh
    lock_passwd: true
    ssh_authorized_keys:
      - ${ansible_pubkey}
