      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPS_FOLDER:?err}/homarr/configs:/app/data/configs
      - ${APPS_FOLDER:?err}/homarr/icons:/app/public/icons
      - ${APPS_FOLDER:?err}/homarr/data:/data
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
