# Maintainerr - Management Dashboard

# Overseer - Media Management
  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    restart: unless-stopped
    environment:
      - LOG_LEVEL=debug
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - DOCKER_MODS=ghcr.io/themepark-dev/theme.park:readarr
      - TP_THEME=${TP_THEME:?err}
    volumes:
      - '${APPS_FOLDER:?err}/overseerr/config:/app/config'

# Plex - Media Server
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    depends_on:
      gluetun:
        condition: service_started
    network_mode: "service:gluetun"
    restart: unless-stopped
# Add Configurations for GPU Hardware Rendering Here:
#    devices:
#      - /dev/dri/renderD128:/dev/dri/renderD128
#      - /dev/dri/card0:/dev/dri/card0
    volumes:
      - ${APPS_FOLDER:?err}/plex:/config
      - ${DATA_FOLDER:?err}/media:/data/media
    environment:
      - PUID=${PUID:?err}
      - PGID=${PGID:?err}
      - UMASK=${UMASK:?err}
      - TZ=${TIMEZONE:?err}
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM}
# Ports are disabled in containers when they are connected to VPN, as the
